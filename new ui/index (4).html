<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TunaEye – Sea Beyond the Cut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--blue:#1b6cf0;--deep:#0a45d8;--navy:#08266f;--ink:#0b1a3a;--muted:#51647f;--bg:#f4f6fa;--card:#fff;--line:rgba(11,26,58,.09);--soft:#e8f0ff;
--sans:'Inter',system-ui,sans-serif;--serif:'Instrument Serif',Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4,p,dl,dd{margin:0}button{font-family:inherit}a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #ffd54a;outline-offset:3px}
.serif{font-family:var(--serif);font-style:italic;font-weight:400}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* nav */
.nav{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;width:min(1100px,calc(100% - 20px));height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 20px;border-radius:999px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;box-shadow:0 12px 40px rgba(10,40,120,.2);transition:background .3s,color .3s}
.nav.solid{background:rgba(255,255,255,.88);color:var(--navy)}

.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:18px;letter-spacing:-.03em;background:none;border:0;color:inherit;cursor:pointer}
.brand svg{width:26px;height:26px}.brand em{font-style:normal;color:#9fd0ff}.nav.solid .brand em{color:var(--blue)}
.links{display:flex;gap:2px;align-items:center}
.links>button,.dd>button{background:none;border:0;color:inherit;font:500 14px var(--sans);padding:9px 15px;border-radius:999px;cursor:pointer;opacity:.92}
.links>button:hover,.dd>button:hover{background:rgba(255,255,255,.22)}.nav.solid .links>button:hover,.nav.solid .dd>button:hover{background:var(--soft)}
.links .on{background:#fff!important;color:var(--deep);opacity:1;box-shadow:0 6px 18px rgba(10,60,200,.25)}
.dd{position:relative}.menu{position:absolute;top:calc(100% + 14px);left:0;background:#fff;color:var(--navy);border-radius:22px;padding:8px;min-width:230px;box-shadow:0 24px 60px rgba(8,30,100,.3);opacity:0;transform:translateY(-8px) scale(.97);pointer-events:none;transition:.2s}
.dd.open .menu{opacity:1;transform:none;pointer-events:auto}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:13px 16px;border-radius:14px;font:600 15px var(--sans);color:var(--navy);cursor:pointer}.menu button:hover{background:#eaf1ff}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;font:500 15px var(--sans);padding:0 26px;min-height:56px;border-radius:999px;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-3px)}
.btn.w{background:#fff;color:var(--ink);box-shadow:0 12px 34px rgba(8,30,100,.28)}
.btn.b{background:linear-gradient(135deg,#2a82f4,#0b45e5);color:#fff;box-shadow:0 12px 30px rgba(11,69,229,.35)}
.btn.g{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.5)}
.btn.o{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:44px;padding:0 20px;font-size:14px}
.tl{background:none;border:0;color:var(--blue);font:600 15px var(--sans);cursor:pointer;padding:0;margin-top:18px}.tl:hover{text-decoration:underline}
@media(max-width:980px){.links{display:none}}
/* hero */
.hero{position:relative;min-height:100svh;overflow:hidden;color:#fff;padding:130px 24px 0;background:linear-gradient(180deg,#031550 0%,#0a3cc4 50%,#3d8cf3 100%);display:flex;flex-direction:column}
.cloud{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.9),rgba(255,255,255,.45) 55%,rgba(255,255,255,0));filter:blur(16px);pointer-events:none}
.c1{width:560px;height:340px;left:-180px;bottom:40px;animation:dr 22s ease-in-out infinite alternate}.c2{width:640px;height:380px;right:-220px;bottom:0;animation:dr 28s ease-in-out infinite alternate-reverse}
.c3{width:420px;height:240px;left:-100px;top:30%;opacity:.5;animation:dr 18s ease-in-out infinite alternate}.c4{width:480px;height:260px;right:-140px;top:22%;opacity:.45;animation:dr 24s ease-in-out infinite alternate-reverse}
@keyframes dr{to{transform:translateX(70px)}}
.hgrid{position:relative;z-index:2;max-width:1200px;margin:0 auto;width:100%;display:grid;grid-template-columns:1.05fr .95fr;gap:20px;align-items:center;flex:1}
.pill{display:inline-flex;gap:8px;align-items:center;padding:7px 15px;border-radius:999px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);font-size:13px;backdrop-filter:blur(10px)}
.pill i{width:7px;height:7px;border-radius:50%;background:#7dffb0;animation:pu 1.8s infinite}@keyframes pu{50%{box-shadow:0 0 0 7px rgba(125,255,176,0)}0%{box-shadow:0 0 0 0 rgba(125,255,176,.7)}}
.hero h1{font-size:clamp(54px,7.4vw,112px);font-weight:300;line-height:.93;letter-spacing:-.05em;margin:24px 0 22px;text-shadow:0 10px 40px rgba(5,30,110,.25)}
.hero h1 .w{display:block;overflow:hidden;padding-bottom:.08em}.hero h1 .w span{display:inline-block;transform:translateY(105%);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}.hero h1 .w:nth-child(2) span{animation-delay:.15s}
@keyframes up{to{transform:none}}
.quote{font-size:21px;font-weight:400;max-width:470px;letter-spacing:-.01em}.supp{opacity:.85;font-weight:300;margin-top:10px}
.ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.stage{position:relative;aspect-ratio:1;max-width:560px;width:100%;margin:0 auto;perspective:900px}
.stage .logo{position:absolute;inset:6%;transition:transform .15s;transform-style:preserve-3d}
.spin{transform-origin:50% 50%;animation:sp 40s linear infinite}.spin2{transform-origin:50% 50%;animation:sp 26s linear infinite reverse}.spin3{transform-origin:50% 50%;animation:sp 70s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.fish{animation:sp 18s linear infinite;transform-origin:200px 200px}
.glint{animation:gl 3s ease-in-out infinite}@keyframes gl{50%{opacity:.35}}
.fimg{position:absolute;filter:drop-shadow(0 22px 28px rgba(5,30,110,.35));animation:fl 6s ease-in-out infinite}
.fimg.a{width:42%;left:-6%;bottom:8%;transform:rotate(-14deg)}.fimg.b{width:36%;right:-4%;top:6%;transform:rotate(10deg);animation-delay:-3s}
@keyframes fl{50%{translate:0 -14px}}
.chip3{position:absolute;background:rgba(255,255,255,.9);color:var(--ink);border-radius:18px;padding:10px 14px;font-size:12px;box-shadow:0 18px 40px rgba(8,30,100,.3);animation:fl 7s ease-in-out infinite}
.chip3 b{display:block;font-size:20px;font-weight:500;letter-spacing:-.03em}.chip3.a{right:2%;bottom:14%;animation-delay:-1s}.chip3.b{left:4%;top:10%;animation-delay:-4s}
@media(max-width:980px){.hgrid{grid-template-columns:1fr;text-align:center}.quote,.supp{margin-inline:auto}.ctas{justify-content:center}.stage{max-width:380px}}
.band{position:relative;z-index:2;max-width:1100px;margin:30px auto 24px;width:100%;background:var(--navy);border-radius:999px;display:flex;justify-content:space-around;gap:10px;padding:20px 28px;font-size:14px;font-weight:500;box-shadow:0 20px 50px rgba(5,25,90,.4)}
.band span{display:flex;gap:10px;align-items:center;white-space:nowrap}.band b{color:#7db7fb;font-family:var(--serif);font-style:italic;font-weight:400;font-size:18px}
@media(max-width:820px){.band{border-radius:28px;flex-direction:column;align-items:flex-start}}
/* sections */
section{padding:110px 24px;position:relative}.wrap{max-width:1100px;margin:0 auto}.ct{text-align:center}
.chip{display:inline-block;padding:6px 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--muted)}
h2{font-size:clamp(34px,4.8vw,64px);font-weight:500;letter-spacing:-.045em;line-height:1.02;margin:18px 0 16px}.ct h2{margin-inline:auto;max-width:860px}
.lead{color:var(--muted);font-size:17px;max-width:600px}.ct .lead{margin-inline:auto}
.tint{background:linear-gradient(180deg,var(--soft),var(--bg))}
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}.split.r>:first-child{order:2}
@media(max-width:900px){.split{grid-template-columns:1fr;gap:36px}.split.r>:first-child{order:0}}
.grid{display:grid;gap:18px;margin-top:52px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}@media(max-width:600px){.g4,.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:28px;padding:26px;border:1px solid var(--line);text-align:left;box-shadow:0 18px 50px rgba(20,60,160,.07);transition:transform .35s,box-shadow .35s}
.card:hover{transform:translateY(-6px);box-shadow:0 28px 60px rgba(20,60,160,.16)}
.card h3{font-size:19px;font-weight:600;letter-spacing:-.02em;margin:14px 0 6px}.card p{color:var(--muted);font-size:15px}
.ico{width:52px;height:52px;border-radius:17px;background:linear-gradient(135deg,#dbe9ff,#b9d4ff);display:grid;place-items:center;color:var(--deep);font-size:26px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.pills span{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--blue);font-weight:500}
.num{font-family:var(--serif);font-style:italic;font-size:46px;color:var(--blue);line-height:1}
/* laptop */
.lap{position:relative;max-width:560px;margin:auto}
.scr{background:#0b1a3a;border:10px solid #1a2238;border-bottom-width:14px;border-radius:20px 20px 6px 6px;aspect-ratio:16/10;overflow:hidden;position:relative;box-shadow:0 40px 80px rgba(10,50,160,.3)}
.base{height:14px;background:linear-gradient(#cfd6e4,#98a3b8);border-radius:0 0 18px 18px;margin:0 -4%}
.ui{position:absolute;inset:0;background:linear-gradient(160deg,#f4f8ff,#dbe8ff);padding:14px;display:flex;flex-direction:column;gap:10px;color:var(--navy)}
.ui .top{display:flex;justify-content:space-between;font-size:10px;font-weight:600}
.ui .cam{flex:1;border-radius:14px;background:#fff;display:grid;place-items:center;position:relative;overflow:hidden}.ui .cam img{width:55%}
.ui .cam:after{content:"";position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#1b6cf0,transparent);animation:scan 2.6s ease-in-out infinite}
@keyframes scan{0%,100%{top:8%}50%{top:90%}}
.bar{height:8px;border-radius:9px;background:#cfe0ff;overflow:hidden}.bar i{display:block;height:100%;width:30%;background:var(--blue);animation:bar 4s ease-in-out infinite}@keyframes bar{50%{width:92%}}
.play{position:absolute;inset:0;margin:auto;width:84px;height:84px;border:0;border-radius:50%;background:#fff;color:var(--deep);font-size:32px;display:grid;place-items:center;cursor:pointer;box-shadow:0 18px 40px rgba(10,50,160,.4);animation:ring 2.4s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(27,108,240,.55),0 18px 40px rgba(10,50,160,.4)}100%{box-shadow:0 0 0 30px rgba(27,108,240,0),0 18px 40px rgba(10,50,160,.4)}}
.olab{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);background:rgba(11,26,58,.8);color:#fff;font-size:12px;padding:6px 14px;border-radius:999px;white-space:nowrap}
/* phone */
.pwrap{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap}
.phone{width:230px;aspect-ratio:9/19;background:#0b1a3a;border-radius:38px;padding:9px;box-shadow:0 36px 70px rgba(10,50,160,.35)}
.pscr{width:100%;height:100%;border-radius:30px;background:#f4f8ff;position:relative;overflow:hidden;color:var(--navy)}
.pscr:before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:64px;height:18px;background:#0b1a3a;border-radius:12px;z-index:3}
.sc{position:absolute;inset:0;padding:42px 16px 16px;opacity:0;transition:opacity .5s;display:flex;flex-direction:column;gap:10px}.sc.on{opacity:1}
.sc h5{margin:0;font-size:15px;font-weight:600;letter-spacing:-.02em}.sc .bx{border-radius:14px;background:#fff;padding:10px;font-size:11px;box-shadow:0 6px 16px rgba(20,60,160,.1)}
.sc .bt{margin-top:auto;background:var(--blue);color:#fff;border-radius:999px;text-align:center;padding:10px;font-size:12px;font-weight:500}.sc img{width:80%;margin:auto}
.qr{background:#fff;border-radius:26px;padding:20px;text-align:center;box-shadow:0 24px 60px rgba(20,60,160,.15);color:#0b1a3a}.qr svg{width:160px;height:160px;display:block;margin:10px auto}.qr small{color:var(--muted)}
.steps{display:grid;gap:14px;margin-top:26px}.steps div{display:flex;gap:14px;align-items:flex-start}.steps b{flex:none;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:14px}.steps p{color:var(--muted);font-size:14px}.steps strong{display:block;font-size:16px}
/* criteria */
.tabs{display:inline-flex;padding:5px;border-radius:999px;background:var(--card);border:1px solid var(--line);margin-top:28px}
.tabs button{border:0;background:none;color:var(--muted);font:500 14px var(--sans);padding:12px 20px;border-radius:999px;cursor:pointer;transition:.25s}.tabs button[aria-selected=true]{background:var(--blue);color:#fff;box-shadow:0 8px 20px rgba(27,108,240,.35)}
.crit{background:var(--soft);border-radius:36px;padding:44px;display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center;margin-top:44px;text-align:left}
@media(max-width:860px){.crit{grid-template-columns:1fr;padding:26px}}
.crit h3{font-size:28px;letter-spacing:-.03em;font-weight:500}.crit p{color:var(--muted);margin:10px 0}.crit dt{font-weight:600;margin-top:14px}.crit dd{color:var(--muted);font-size:14.5px}
.plate{background:#fff;border-radius:28px;padding:26px;text-align:center;box-shadow:0 20px 50px rgba(20,60,160,.12);position:relative;overflow:hidden}
.plate img{max-height:280px;width:100%;object-fit:contain;animation:fl 6s ease-in-out infinite;filter:drop-shadow(0 18px 20px rgba(120,20,30,.25))}.plate small{display:block;color:#51647f;font-size:12px;font-weight:600;margin-top:10px}
.plate:before{content:"";position:absolute;inset:auto -20% -60% -20%;height:70%;border-radius:50%;background:radial-gradient(closest-side,#dbe9ff,transparent)}
.gb{display:inline-block;padding:5px 13px;border-radius:999px;font-size:13px;font-weight:600;color:#fff}.ga{background:#1fa35a}.gbp{background:#1b6cf0}.gbb{background:#e09a14}.gc{background:#d9453d}
/* workflow */
.wf{background:radial-gradient(circle at 20% 0,#123b9e,var(--navy) 60%);color:#fff;overflow:hidden}.wf .chip{background:rgba(255,255,255,.1);color:#cfe0ff;border-color:rgba(255,255,255,.2)}
.pipe{display:flex;align-items:flex-start;justify-content:center;gap:0;margin-top:56px;flex-wrap:wrap}
.ps{width:140px;text-align:center}.ps .b{width:84px;height:84px;margin:0 auto 14px;border-radius:26px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:36px;color:#9fd0ff;backdrop-filter:blur(8px);animation:glow 4.8s infinite}
.ps:nth-child(3){animation-delay:.8s}.ps:nth-child(5){animation-delay:1.6s}
.ps:nth-child(1) .b{animation-delay:0s}.ps:nth-child(3) .b{animation-delay:.8s}.ps:nth-child(5) .b{animation-delay:1.6s}.ps:nth-child(7) .b{animation-delay:2.4s}.ps:nth-child(9) .b{animation-delay:3.2s}.ps:nth-child(11) .b{animation-delay:4s}
@keyframes glow{0%,100%{background:rgba(255,255,255,.1);transform:none}8%,20%{background:rgba(42,130,244,.55);transform:translateY(-6px);box-shadow:0 14px 40px rgba(42,130,244,.6)}28%{background:rgba(255,255,255,.1);box-shadow:none;transform:none}}
.ps small{color:#7db7fb;font-family:var(--serif);font-style:italic;font-size:20px}.ps div.t{font-weight:500;font-size:15px}
.ar{width:46px;height:84px;display:flex;align-items:center}.ar i{flex:1;height:2px;background:repeating-linear-gradient(90deg,#7db7fb 0 6px,transparent 6px 12px);background-size:24px 2px;animation:dash 1s linear infinite}@keyframes dash{to{background-position:24px 0}}
@media(max-width:700px){.ar{display:none}.ps{width:50%;margin-bottom:24px}}
/* evidence */
.ev{background:var(--card);border-radius:36px;padding:36px;border:1px solid var(--line);display:grid;grid-template-columns:1fr 1.1fr;gap:40px;align-items:center;box-shadow:0 18px 50px rgba(20,60,160,.07);text-align:left}
@media(max-width:860px){.ev{grid-template-columns:1fr;padding:22px}}
.ev h3{font-size:clamp(32px,4vw,52px);font-weight:500;letter-spacing:-.04em;line-height:1.05;margin:14px 0}.ev p{color:var(--muted)}
.ctl{display:flex;gap:12px;align-items:center;margin-top:24px}.ctl button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer;transition:.2s}.ctl button:hover{background:var(--blue);color:#fff}
.evp{background:linear-gradient(160deg,#eef4ff,#fff);border-radius:28px;min-height:320px;display:grid;place-items:center;padding:20px;position:relative;overflow:hidden}

.evp:before{content:"";position:absolute;width:380px;height:380px;border-radius:50%;border:34px solid #e1ecff;animation:sp 30s linear infinite;border-top-color:#bcd6ff}
.evp img{position:relative;width:90%;max-height:300px;object-fit:contain;transition:opacity .3s,transform .5s;filter:drop-shadow(0 20px 22px rgba(120,20,30,.25))}.evp small{position:absolute;top:16px;left:20px;color:var(--muted);font-weight:600;font-size:12px}
/* metrics */
.met{background:linear-gradient(135deg,#0b4fd8,#2a82f4);color:#fff;padding:70px 24px;overflow:hidden}.met .wrap{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:20px}
.met b{display:block;font-size:clamp(38px,5vw,66px);font-weight:300;letter-spacing:-.05em;line-height:1}.met span{opacity:.85;font-size:14px}
@media(max-width:820px){.met .wrap{grid-template-columns:1fr 1fr;row-gap:36px}}
/* infra */
.flow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}.fc{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;text-align:center;box-shadow:0 18px 50px rgba(20,60,160,.08)}
.fc b{font-family:var(--serif);font-style:italic;color:var(--blue);font-size:26px;font-weight:400}.fc h4{margin:4px 0;font-size:16px}.fc p{font-size:12.5px;color:var(--muted)}.fc .i{font-size:30px;color:var(--deep)}
.fa{width:34px;height:2px;background:repeating-linear-gradient(90deg,#1b6cf0 0 6px,transparent 6px 12px);background-size:24px 2px;animation:dash 1s linear infinite}
@media(max-width:600px){.fa{width:2px;height:28px;background:repeating-linear-gradient(0deg,#1b6cf0 0 6px,transparent 6px 12px)}}
details{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 26px;margin-top:12px;text-align:left}
summary{cursor:pointer;font-weight:500;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:16px}summary::-webkit-details-marker{display:none}
summary:after{content:"+";font-size:24px;color:var(--blue);transition:transform .3s}details[open] summary:after{transform:rotate(45deg)}details p{color:var(--muted);margin-top:12px}
/* cta / footer */
.cta{padding-bottom:20px}
footer{position:relative;overflow:hidden;color:#fff;padding:140px 24px 0;margin-top:-40px;background:linear-gradient(180deg,rgba(244,246,250,0) 0%,#1b6cf0 36%,#0a45d8 100%)}

.fg{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:28px;max-width:1100px;margin:0 auto}
@media(max-width:900px){.fg{grid-template-columns:1fr 1fr}}

@media(max-width:900px){.s4,.s5,.s7,.s12{grid-column:span 12}.s12{flex-direction:column;align-items:stretch}.s12 .ilw{flex:none;width:100%}}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding:34px 0}.ab.flip .abi{order:2}.abi .ilw{height:290px;border-radius:30px;box-shadow:0 24px 60px rgba(20,60,160,.15)}.ab h2{margin:14px 0}
@media(max-width:860px){.ab{grid-template-columns:1fr;gap:26px}.ab.flip .abi{order:0}}
.lg{display:grid;grid-template-columns:250px 1fr;gap:40px;align-items:start;margin-top:10px}
.toc{position:sticky;top:96px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;display:grid;gap:4px;box-shadow:0 18px 50px rgba(20,60,160,.07)}.toc b{font-size:13px;color:var(--muted);padding:6px 10px;font-weight:500}
.toc button{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;color:var(--ink);font:500 14px var(--sans);padding:11px 10px;border-radius:14px;cursor:pointer}.toc button:hover{background:var(--soft)}.toc span{font-family:var(--serif);font-style:italic;color:var(--blue);font-size:20px}
.clz{display:grid;grid-template-columns:260px 1fr;gap:26px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:20px;margin-bottom:18px;box-shadow:0 18px 50px rgba(20,60,160,.07)}.clz small{color:var(--blue);font-weight:600;font-size:13px}.clz h3{font-size:24px;letter-spacing:-.03em;margin:4px 0 8px;font-weight:600}.clz p{color:var(--muted)}
@media(max-width:900px){.lg{grid-template-columns:1fr}.toc{position:static;display:none}.clz{grid-template-columns:1fr}}
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:52px}@media(max-width:1000px){.tg{grid-template-columns:1fr 1fr}}@media(max-width:600px){.tg{grid-template-columns:1fr}}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:30px;overflow:hidden;padding:0 20px 26px;text-align:center;box-shadow:0 18px 50px rgba(20,60,160,.08);transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s}.tcard:hover{transform:translateY(-8px);box-shadow:0 30px 70px rgba(20,60,160,.2)}
.tcov{height:112px;margin:0 -20px;position:relative}.tcov svg{position:absolute;inset:0;width:100%;height:100%}.ttag{position:absolute;top:14px;left:16px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px}
.tav{position:relative;width:104px;height:104px;border-radius:50%;margin:-52px auto 14px;border:5px solid var(--card);display:grid;place-items:center;color:#fff;box-shadow:0 12px 30px rgba(10,60,200,.3);transition:transform .5s}.tcard:hover .tav{transform:rotate(-6deg) scale(1.06)}
.tav>span{font-size:40px;line-height:1}.tav i{position:absolute;right:-4px;bottom:2px;width:32px;height:32px;border-radius:50%;background:#fff;color:var(--deep);display:grid;place-items:center;font-size:17px;box-shadow:0 6px 14px rgba(10,50,160,.25)}
.tcard h3{font-size:20px;letter-spacing:-.02em;font-weight:600;margin:0 0 10px}.troles{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}.troles span{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--blue);font-weight:500}.tcard p{color:var(--muted);font-size:14.5px}
.adv{margin-top:26px;display:flex;gap:26px;align-items:center;text-align:left;background:linear-gradient(135deg,#08266f,#0a45d8);color:#fff;border-radius:34px;padding:30px 36px;position:relative;overflow:hidden;flex-wrap:wrap}.adv:after{content:"";position:absolute;right:-60px;top:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(closest-side,rgba(125,183,251,.5),transparent)}
.adv .tav{margin:0;border-color:rgba(255,255,255,.3);background:linear-gradient(135deg,#7db7fb,#1b6cf0)}.adv .tav.big{width:112px;height:112px}.adv h3{font-size:clamp(24px,3vw,34px);font-weight:500;letter-spacing:-.03em;margin:10px 0 4px}.adv p{opacity:.85}
.rv{opacity:0;transform:translateY(30px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}

:root{color-scheme:light}
/* ---- embedded kiosk ---- */
#kiosk-wrap{position:fixed;inset:0;z-index:99999;background:#fff;display:none;overflow:hidden}
#kiosk-wrap.show{display:block}
#kiosk-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#fff}
html.kiosk-open,html.kiosk-open body{overflow:hidden!important}
#kiosk-wrap:fullscreen{width:100vw;height:100vh}
/* Portfolio Documentation */
.docp-hero{position:relative;overflow:hidden;padding:128px 24px 64px;color:#fff;background:radial-gradient(900px 520px at 85% 0%,rgba(59,139,255,.36),transparent 62%),radial-gradient(640px 420px at 10% 100%,rgba(52,211,153,.16),transparent 60%),linear-gradient(160deg,#061436 0%,#0b2870 54%,#040f29 100%)}
.docp-gridbg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:96px 96px;pointer-events:none}
.docp-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding-bottom:28px;border-bottom:1px solid rgba(255,255,255,.14);font-size:12px;color:rgba(255,255,255,.72);position:relative}
.docp-meta b{display:block;color:#fff;font-size:13px;margin-bottom:2px}
.docp-tl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:34px;padding-top:22px;border-top:1px solid rgba(255,255,255,.22);position:relative}
.docp-tl div{position:relative;padding-top:14px}
.docp-tl div:before{content:"";position:absolute;top:-27px;left:0;width:10px;height:10px;border-radius:50%;background:#34d399;box-shadow:0 0 0 4px rgba(52,211,153,.24)}
.docp-tl span{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7db7fb}
.docp-tl strong{display:block;font-size:15px;color:#fff;margin-top:4px}
.docp-tl p{margin:4px 0 0;font-size:12.5px;color:rgba(255,255,255,.68)}
.docp-stage{position:relative;overflow:hidden;border-radius:30px;padding:38px 34px;color:#fff;background:radial-gradient(640px 360px at 80% 20%,rgba(59,139,255,.32),transparent 65%),linear-gradient(155deg,#071636,#040e24);border:1px solid rgba(125,183,251,.22);box-shadow:0 28px 70px -24px rgba(4,15,41,.65)}
.docp-fan{display:flex;justify-content:center;align-items:center;gap:0;margin:28px 0 18px;padding:12px 0;min-height:240px}
.docp-fan img{width:240px;aspect-ratio:16/10;object-fit:cover;border-radius:16px;border:2px solid rgba(255,255,255,.26);box-shadow:0 22px 44px -14px rgba(0,0,0,.65);transition:transform .3s ease,z-index .1s;cursor:zoom-in;margin-left:-44px;background:#091a42}
.docp-fan img:first-child{margin-left:0;transform:rotate(-7deg) translateY(10px)}
.docp-fan img:nth-child(2){transform:rotate(-3.5deg) translateY(3px)}
.docp-fan img:nth-child(3){transform:translateY(-4px) scale(1.06);z-index:3;border-color:#7db7fb}
.docp-fan img:nth-child(4){transform:rotate(3.5deg) translateY(3px)}
.docp-fan img:nth-child(5){transform:rotate(7deg) translateY(10px)}
.docp-fan img:hover{transform:translateY(-12px) scale(1.1)!important;z-index:10;border-color:#fff}
.docp-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:16px}
.docp-shot{position:relative;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);cursor:zoom-in;transition:transform .2s ease,border-color .2s ease}
.docp-shot:hover{transform:translateY(-3px);border-color:#7db7fb}
.docp-shot img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.docp-shot span{display:block;padding:8px 10px;font-size:11.5px;font-weight:700;color:rgba(255,255,255,.86)}
.docp-bento{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:20px}
.docp-bcard{position:relative;border-radius:22px;overflow:hidden;background:#fff;border:1px solid #e3eaf8;box-shadow:0 12px 32px -18px rgba(18,59,112,.22);cursor:zoom-in;transition:transform .22s ease}
.docp-bcard:hover{transform:translateY(-4px)}
.docp-bcard.wide{grid-column:span 2}
.docp-bcard img{width:100%;height:100%;min-height:220px;max-height:310px;object-fit:cover;display:block}
.docp-bcap{position:absolute;left:14px;bottom:14px;padding:6px 12px;border-radius:999px;background:rgba(4,15,41,.78);color:#fff;font-size:12px;font-weight:700;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16)}
@media(max-width:900px){.docp-meta,.docp-tl{grid-template-columns:1fr 1fr}.docp-strip{grid-template-columns:repeat(2,minmax(0,1fr))}.docp-bento{grid-template-columns:1fr}.docp-bcard.wide{grid-column:span 1}.docp-fan{display:none}}
</style>

docs:['Documentation','Data Collection & Consultation.','How TunaEye captures standardized yellowfin tuna datasets, collaborates with port graders, and trains Sashibo Core and Tail-Cut V2 models.',[['Fixed Dataset Capturer (TunCam)','Used https://tuncam.vercel.app/ as our fixed-mount dataset capturer inside the 5000K CRI 98+ lighting chamber to eliminate glare and framing drift.'],['Dataset Labeller & Annotator','Used https://tuncam.vercel.app/ alongside trained annotators to label Sashibo Core and Tail-Cut samples into Grade A, Grade B, Grade C, and Invalid classes.'],['Expert Grader Consultation','Conducted on-site consultations with veteran General Santos port graders to align confidence thresholds (80%), Tail-Cut escalation rules, and provisional review workflows.'],['Model Validation & Edge Deployment','Trained separate Sashibo Core V2 and Tail-Cut V2 models and deployed them offline on Raspberry Pi 5 without averaging predictions across cuts.']],2]};

var LZ_V=`#version 300 es
in vec2 aPosition;
void main() {
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;
var LZ_F=`#version 300 es
precision highp float;
out vec4 outColor;
uniform vec2 uResolution;
uniform float uDpr;
uniform float uScale;
uniform float uTime;
uniform float uBeamX;
uniform vec4 uSurface;
uniform float uRadius;
uniform vec3 uIntro;
uniform vec4 uPour;
uniform vec2 uRun;
uniform vec4 uLens;
uniform sampler2D uReveal;
uniform vec4 uRevealMap;
uniform vec2 uRevealInfo;
uniform float uAtmosphere;
uniform vec4 uAmount;
uniform vec4 uShape;
uniform vec4 uExtra;
uniform float uTheme;
uniform vec3 uTint[16];

#define BEAM uTint[0]
#define LEFT uTint[1]
#define RIGHT uTint[2]
#define CYAN uTint[3]
#define PINK uTint[4]
#define LILAC uTint[5]
#define SKY uTint[6]
#define PURPLE uTint[7]
#define DEEP uTint[8]
#define MIST uTint[9]
#define NAVY uTint[10]
#define WARM uTint[11]
#define EMBER uTint[12]
#define WHITE uTint[13]
#define HAZE uTint[14]
#define LAVENDER uTint[15]

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
}

float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 5; i++) {
    v += a * noise(p);
    p = m * p;
    a *= 0.5;
  }
  return v;
}

float sq(float x) {
  return x * x;
}

float roundBox(vec2 p, vec2 b, float r) {
  vec2 q = abs(p) - b + r;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
}

vec3 spill(float e, float fall, float strength, float front, float t, out vec3 glow) {
  glow = vec3(0.0);
  if (strength < 0.0005) return vec3(0.0);
  float f = max(fall, 0.0);
  float d = max(e, 0.0);
  float u = d / (6.0 + 0.28 * f);
  float start = smoothstep(-6.0, 12.0, fall);
  float fade = exp(-sq(max(f - 125.0, 0.0) / 40.0));
  float streak = 0.88 + 0.24 * noise(vec2(u * 6.0, f / 22.0 - t * 1.7));
  float bright = pow(strength, 1.5);
  float soft = sqrt(strength);
  float warmth = smoothstep(90.0, 130.0, f);
  vec3 coreK = mix(WHITE, WARM, warmth * exp(-d / 9.0));
  float core = mix(9.0, 2.6, warmth) * exp(-sq(d / (3.5 + 0.04 * f))) * exp(-sq(max(f - 130.0, 0.0) / 38.0));
  float wall = 24.0 * exp(-sq(d / 1.1)) * exp(-sq(max(f - 100.0, 0.0) / 30.0));
  float bandCenter = 0.7 - 0.3 * smoothstep(30.0, 110.0, f);
  float offset = u - bandCenter;
  float decay = (1.05 - bandCenter) / 1.31;
  float profile = offset < 0.0 ? exp(-sq(offset / 0.3)) : exp(-offset / decay);
  profile *= 1.0 - smoothstep(1.0, 1.4, u);
  vec3 bandA = mix(CYAN, PINK, smoothstep(50.0, 75.0, f));
  bandA = mix(bandA, LILAC, smoothstep(100.0, 125.0, f));
  vec3 bandB = mix(SKY, PURPLE, smoothstep(50.0, 75.0, f));
  vec3 fanK = mix(bandA, bandB, smoothstep(0.06, 0.18, offset));
  fanK = mix(fanK, DEEP, smoothstep(0.22, 0.42, offset));
  vec3 thread = WHITE * wall * bright + coreK * core * streak * bright;
  glow += fanK * 4.5 * profile * fade * streak * bright;
  glow += MIST * 0.7 * exp(-max(u - 1.0, 0.0) / 0.9) * smoothstep(0.7, 1.2, u) * fade * soft;
  glow += EMBER * 0.35 * exp(-sq((f - 165.0) / 22.0)) * exp(-d / 25.0) * bright;
  float lag = u * (6.0 + 0.28 * f) * 0.35;
  float reveal = 1.0 - smoothstep(front - 70.0, front + 8.0, f + lag);
  glow *= start * reveal;
  return thread * start * reveal;
}

vec3 easeLight(vec3 light, float amount) {
  return -log(max(1.0 - amount * (1.0 - exp(-light)), vec3(0.0001)));
}

void main() {
  vec2 frag = vec2(gl_FragCoord.x, uResolution.y * uDpr - gl_FragCoord.y) / uDpr;
  vec2 p = frag / uScale;
  float t = uTime;
  float bx = uBeamX / uScale;
  float sl = uSurface.x / uScale;
  float sy = uSurface.y / uScale;
  float sr = uSurface.z / uScale;
  float sb = uSurface.w / uScale;
  float radius = uRadius / uScale;
  float dx = p.x - bx;
  float adx = abs(dx);
  float h = sy - p.y;
  float hp = max(h, 0.0);
  float above = smoothstep(-0.5, 0.5, h);
  float side = smoothstep(-24.0, 24.0, dx);
  vec3 sideK = mix(mix(LAVENDER, LEFT, smoothstep(40.0, 140.0, adx)), RIGHT, side);
  float beamWidth = uShape.x;
  float flare = uShape.y;
  float spread = 250.0 * uShape.z;
  float reachL = max(bx - sl, 1.0);
  float reachR = max(sr - bx, 1.0);
  float reach = dx < 0.0 ? reachL : reachR;
  float layerLen = clamp(0.29 * reach, 20.0, 100.0) * sqrt(uShape.z);
  float run = uRun.x;
  float runMask = 1.0 - smoothstep(run - 34.0, run + 6.0, adx);
  float bead = exp(-sq((adx - run + 16.0) / (18.0 + 0.04 * run))) * uRun.y;
  float flowMask = (1.0 - smoothstep(0.75 * spread, 1.1 * spread, adx)) * runMask;
  float edgeMask = (1.0 - smoothstep(0.8 * spread, 1.25 * spread, adx)) * runMask;
  float bloom = uIntro.y;
  vec2 center = vec2((sl + sr) * 0.5, (sy + sb) * 0.5);
  vec2 halfSize = vec2((sr - sl) * 0.5, (sb - sy) * 0.5);
  float sd = roundBox(p - center, halfSize, radius);
  float outline = max(sd, 0.0);
  float below = max(p.y - sy - radius, 0.0);
  float hug = smoothstep(-0.5, 0.5, sd) * exp(-sq(below / 14.0));
  float hugWide = smoothstep(-0.5, 0.5, sd) * exp(-sq(below / 40.0));

  vec3 col = vec3(0.0);

  float breathe = 1.0 + uExtra.x * (0.12 * sin(t * 1.5708) + 0.08 * (noise(vec2(t * 0.5, 3.0)) - 0.5));

  float front = uIntro.x / uScale;
  float drop = smoothstep(front + 10.0, front - 110.0, p.y);
  float falling = 1.0 - smoothstep(sy - 24.0, sy, front);
  float top = mix(0.3, 1.0, smoothstep(0.0, 0.3 * sy, p.y));
  float beamCore = 24.0 * exp(-adx / (2.0 * beamWidth));
  float beamHalo = 1.3 * exp(-adx / (6.0 * beamWidth)) + 0.3 * exp(-adx / (22.0 * beamWidth));
  vec3 haloK = mix(BEAM, sideK, exp(-hp / 80.0));
  col += (BEAM * beamCore + haloK * beamHalo) * top * above * drop;
  float head = exp(-sq((p.y - front) / 24.0)) * falling;
  col += mix(WHITE, BEAM, 0.35) * head * (7.0 * exp(-adx / (2.6 * beamWidth)) + 1.0 * exp(-adx / (14.0 * beamWidth)));

  float psi = adx * (outline + 1.0);
  float rise = max(hp - 17.9 * flare, 0.0);
  float skirtAmp = 16.6 * (exp(-sq(rise / (11.8 * flare))) + 0.3 * exp(-rise / (60.0 * flare)));
  float skirtSpread = mix(134.0, 155.0, side) * breathe * flare * flare * mix(0.35, 1.0, min(bloom, 1.0)) * max(bloom, 1.0);
  float skirt = skirtAmp * exp(-psi / skirtSpread) * exp(-sq(adx / (max(layerLen, 60.0 * sqrt(uShape.z)) * 1.48))) * hug;
  col += sideK * skirt * flowMask * min(bloom, 1.0);

  float layer = 12.0 * exp(-adx / layerLen) * exp(-outline / (0.19 * layerLen)) * (1.0 + 0.4 * bead);
  col += sideK * layer * hug * flowMask * min(bloom, 1.0);
  float washMask = smoothstep(sl - 60.0, sl + 6.0, p.x) * (1.0 - smoothstep(sr - 6.0, sr + 45.0, p.x));
  float wash = 1.4 * exp(-adx / 100.0) * exp(-outline / 30.0);
  col += mix(BEAM, sideK, 0.25) * wash * hugWide * washMask * flowMask * min(bloom, 1.0);
  float highWash = 0.7 * exp(-adx / 140.0) * exp(-outline / 60.0);
  col += mix(BEAM, NAVY, 0.5) * highWash * hugWide * washMask * runMask * min(bloom, 1.0);

  float sideSign = dx < 0.0 ? 0.0 : 1.0;
  float along = 0.5 * log((hp + 1.0) / (adx + 1.0));
  float lineScale = 6.0;
  float lp = log(max(psi, 1.0) / (120.0 * flare * flare)) * lineScale;
  float lineIndex = floor(lp) + sideSign * 97.0;
  float wobble = 0.22 * (noise(vec2(lineIndex * 3.7, t * 0.4 + along)) - 0.5);
  float lf = fract(lp + wobble) - 0.5;
  float gradient = lineScale * length(vec2(hp + 1.0, adx)) / max(psi, 1.0) / uScale;
  float halfWidth = max(0.35 * gradient, 0.0001);
  float drawWidth = max(halfWidth, 0.6 * gradient);
  float lineShape = exp(-lf * lf / (drawWidth * drawWidth)) * (halfWidth / drawWidth);
  float lineOn = step(0.3, hash(vec2(lineIndex, 1.3)));
  float lineFlow = smoothstep(0.25, 0.85, noise(vec2(lineIndex * 5.3 + 2.0, along * 3.0 + t * 1.1)));
  float flareArea = 120.0 * flare * flare;
  float lineEnvelope = smoothstep(0.85 * flareArea, 1.4 * flareArea, psi) * (1.0 - smoothstep(3.2 * flareArea, 7.5 * flareArea, psi));
  lineEnvelope *= exp(-adx / (layerLen * 1.5)) * hug * flowMask * (1.0 - smoothstep(35.0 * flare, 80.0 * flare, hp));
  float lineBright = mix(0.35, 1.0, hash(vec2(lineIndex, 4.0)));
  col += mix(sideK, WHITE, 0.6) * lineShape * lineOn * lineFlow * lineEnvelope * lineBright * 2.6 * uAmount.w * min(bloom, 1.0);

  float edgeGlow = 22.8 * exp(-sq(adx / (150.0 * uShape.z))) * edgeMask * (1.0 + 0.9 * bead);
  float onTop = 1.0 - smoothstep(sy + radius, sy + radius + 10.0, p.y);
  float edgeLine = (exp(-sq(max(sd, 0.0) / 0.9)) + 0.12 * exp(-max(sd, 0.0) / 3.0)) * edgeGlow * onTop;
  col += mix(sideK, WHITE, 0.6) * edgeLine * min(bloom, 1.0);

  float pour = uShape.w;
  float baseline = exp(-sq(130.0 / 150.0));
  float strengthR = exp(-sq(reachR / (150.0 * uShape.z))) * (1.0 - smoothstep(0.8 * spread, 1.25 * spread, reachR)) / baseline * pour;
  float strengthL = exp(-sq(reachL / (150.0 * uShape.z))) * (1.0 - smoothstep(0.8 * spread, 1.25 * spread, reachL)) / baseline * pour;
  float fallY = p.y - sy - 0.3 * radius;
  float rightHalf = smoothstep(center.x - 4.0, center.x + 4.0, p.x);
  float haloR = exp(-length(p - vec2(sr - 0.3 * radius, sy + 0.3 * radius)) / 40.0) * sqrt(strengthR);
  float haloL = exp(-length(p - vec2(sl + 0.3 * radius, sy + 0.3 * radius)) / 40.0) * sqrt(strengthL);
  vec3 glowR;
  vec3 glowL;
  col += spill(sd, fallY, strengthR, uPour.y, t, glowR) * rightHalf;
  col += spill(sd, fallY, strengthL, uPour.x, t, glowL) * (1.0 - rightHalf);
  col += easeLight(glowR * rightHalf + NAVY * 0.9 * haloR, uPour.w);
  col += easeLight(glowL * (1.0 - rightHalf) + NAVY * 0.9 * haloL, uPour.z);

  vec2 toLens = frag - uLens.xy;
  float lens = exp(-dot(toLens, toLens) / sq(uLens.z)) * uLens.w;
  col *= 1.0 + 0.35 * lens * hug;
  float fogAmount = uAmount.y * uAtmosphere;
  float near = exp(-adx / 150.0);
  float envelope = near * (0.3 + 0.4 * exp(-hp / 50.0) + 1.2 * exp(-p.y / 120.0));
  if (fogAmount > 0.001 && h > -2.0 && envelope * max(0.25, 6.0 * exp(-adx / 50.0)) > 0.002) {
    vec2 fq = vec2(dx / 1.7, h) / 85.0 + vec2(t * 0.012, -t * 0.03) + uExtra.zw;
    vec2 fw = vec2(fbm(fq * 1.3 + vec2(1.7, 9.2) + t * 0.03), fbm(fq * 1.3 + vec2(8.3, 2.8) - t * 0.025));
    float cloud = fbm(fq + 1.4 * fw);
    float density = smoothstep(0.5, 0.78, cloud);
    float lit = exp(-adx / 50.0);
    float fogMask = smoothstep(-2.0, 20.0, h);
    float reached = smoothstep(front + 80.0, front - 40.0, p.y);
    vec3 fog = (HAZE * 0.45 + BEAM * 6.0 * lit * reached) * density * envelope * fogMask;
    float surfaceLit = exp(-adx / (layerLen * 1.3)) * exp(-outline / 28.0) * hugWide * flowMask * washMask * min(bloom, 1.0);
    fog += sideK * 2.2 * surfaceLit * (smoothstep(0.38, 0.72, cloud) - 0.35) * fogMask;
    float smoke = smoothstep(0.3, 0.75, cloud);
    fog += BEAM * 0.35 * exp(-adx / (22.0 * beamWidth)) * (0.35 + 0.9 * smoke) * fogMask * top * drop;
    col += fog * fogAmount * (1.0 + 1.2 * lens) * mix(1.0, 0.45, uTheme);
  }

  if (uRevealInfo.y > 0.001 && uLens.w > 0.002) {
    vec2 toReveal = frag - uLens.xy;
    float reveal = exp(-dot(toReveal, toReveal) / sq(uRevealInfo.x)) * uLens.w;
    vec2 uv = frag * uRevealMap.xy + uRevealMap.zw;
    float onImage = step(0.0, uv.x) * step(uv.x, 1.0) * step(0.0, uv.y) * step(uv.y, 1.0);
    vec4 ui = texture(uReveal, uv);
    float ink = max(ui.r, max(ui.g, ui.b)) * onImage;
    float lit = clamp(col.b * 0.9, 0.0, 1.0) * (1.0 - smoothstep(0.9, 2.2, col.b));
    float clearance = smoothstep(60.0 * sqrt(beamWidth), 150.0 * sqrt(beamWidth), adx);
    col += mix(BEAM, WHITE, 0.4) * ink * reveal * lit * clearance * uRevealInfo.y * 2.2;
  }

  float haze = col.b;
  float dotGrid = 1.0 - smoothstep(0.16, 0.32, length(fract(frag / 3.0) - 0.5));
  col += BEAM * dotGrid * clamp(haze, 0.0, 1.5) * (1.0 - smoothstep(1.5, 4.0, haze)) * (0.18 + 0.3 * lens) * uExtra.y;
  if (lens > 0.002) {
    vec2 drift = frag - vec2(0.0, t * 14.0);
    vec2 sparkCell = floor(drift / 7.0);
    vec2 sparkPos = (sparkCell + 0.2 + 0.6 * vec2(hash(sparkCell + 5.1), hash(sparkCell + 2.3))) * 7.0;
    float sparkDist = length(drift - sparkPos);
    float sparkOn = step(0.8, hash(sparkCell + 8.8));
    float sparkTwinkle = 0.5 + 0.5 * sin(t * 5.0 + hash(sparkCell + 3.7) * 6.283);
    col += WHITE * exp(-sparkDist * sparkDist / 0.35) * sparkOn * sparkTwinkle * lens * clamp(haze * 1.5, 0.0, 1.0) * 1.6 * uAmount.z;
  }

  float dustAmount = uAmount.z;
  if (dustAmount > 0.001) {
    float dustLp = log(max(psi, 1.0) / (120.0 * flare * flare)) * 2.2;
    vec2 flowCell = vec2(dustLp / 1.1, (along + t * 0.22) / 0.06);
    vec2 cellId = floor(flowCell) + vec2(sideSign * 131.0, 0.0);
    vec2 cellJitter = vec2(hash(cellId + 1.7), hash(cellId + 8.3));
    vec2 particleFlow = (floor(flowCell) + 0.1 + cellJitter * 0.8) * vec2(1.1, 0.06);
    float particlePsi = 120.0 * flare * flare * exp(particleFlow.x / 2.2);
    float particleAlong = particleFlow.y - t * 0.22;
    float particleX = sqrt(particlePsi * exp(-2.0 * particleAlong)) - 1.0;
    float particleH = sqrt(particlePsi * exp(2.0 * particleAlong)) - 1.0;
    float particleDist = length(vec2(adx - particleX, hp - particleH)) * uScale;
    float particleOn = step(0.62, hash(cellId + 3.1));
    float particleTwinkle = 0.5 + 0.5 * sin(t * 5.0 + hash(cellId + 9.2) * 6.283);
    float dustZone = exp(-sq(log(max(psi, 1.0) / (200.0 * flare * flare)) / 0.55)) * hug * flowMask * smoothstep(0.0, 6.0, outline);
    col += WHITE * exp(-particleDist * particleDist / 0.3) * particleOn * particleTwinkle * dustZone * 3.0 * dustAmount * min(bloom, 1.0);

    vec2 glitterCell = vec2(dx / 3.0, (p.y - t * 26.0) / 9.0);
    vec2 glitterId = floor(glitterCell);
    vec2 glitterJitter = vec2(hash(glitterId + 4.4), hash(glitterId + 2.9));
    vec2 glitterPos = (glitterId + 0.15 + glitterJitter * 0.7) * vec2(3.0, 9.0);
    float glitterDist = length(vec2(dx, p.y - t * 26.0) - glitterPos) * uScale;
    float glitterOn = step(0.7, hash(glitterId + 6.6));

::selection{background:#cfe0ff}
button{transition:transform .18s var(--e),box-shadow .2s var(--e),background .2s,color .2s,opacity .2s;appearance:none;-webkit-appearance:none}
button:focus-visible,input:focus-visible,tr.r:focus-visible,.half:focus-visible{outline:3px solid var(--b2);outline-offset:3px}
button[disabled]{cursor:not-allowed}
.scr>*{animation:rise .6s var(--e) backwards}
.scr>*:nth-child(2){animation-delay:.04s}.scr>*:nth-child(3){animation-delay:.08s}.scr>*:nth-child(4){animation-delay:.12s}.scr>*:nth-child(5){animation-delay:.16s}.scr>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}@keyframes fade{from{opacity:0}}
.card{box-shadow:0 1px 0 #fff inset,0 2px 4px rgba(11,22,48,.03),0 24px 56px -12px rgba(37,99,255,.14)}
.pill{letter-spacing:-.01em;position:relative;overflow:hidden}
.pill:not([disabled]):hover{transform:translateY(-2px);box-shadow:0 5px 0 #1a46c9,0 18px 34px rgba(37,99,255,.38)}.pill.w:not([disabled]):hover{box-shadow:0 4px 0 var(--bd),0 14px 28px rgba(37,99,255,.14)}
.pill:not([disabled]):active{transform:translateY(2px) scale(.985);box-shadow:0 1px 0 #1a46c9,0 6px 14px rgba(37,99,255,.3)}
.pill:not(.w):not([disabled]):before{content:"";position:absolute;inset:0 0 50%;background:linear-gradient(rgba(255,255,255,.28),transparent);pointer-events:none}
.sq:hover,.sb:hover span{transform:translateY(-2px);box-shadow:0 10px 22px rgba(37,99,255,.18)}.sb:active span,.sq:active{transform:scale(.92)}
.bk:hover{color:var(--ink)}.bk:active{transform:scale(.96)}
.kp button:hover{border-color:#c4d4fb;background:#fafcff}.kp button:active{background:#eaf0ff}
.half:hover{filter:brightness(.98)}.half:hover .tile{transform:scale(1.06)}.half:active{filter:brightness(.94)}.tile{transition:transform .3s var(--e)}
tr.r{transition:background .15s}tr.r:active{background:#eaf0ff}
.inp{transition:box-shadow .25s var(--e),border-color .25s}.inp::placeholder{color:#b9c3dc}
.chip{transition:all .25s var(--e)}.big{transition:color .2s,transform .15s var(--e)}
.rng u{transition:width .3s var(--e)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.pill.busy{pointer-events:none;opacity:.9}
.toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);z-index:60;background:#0b1630;color:#fff;padding:14px 22px;border-radius:16px;font-size:16px;font-weight:700;box-shadow:0 14px 34px rgba(11,22,48,.3);animation:tin .35s var(--e);display:flex;gap:10px;align-items:center}.toast.er{background:var(--er)}
@keyframes tin{from{opacity:0;transform:translate(-50%,-14px)}}
.ovl{position:absolute;inset:0;z-index:50;background:rgba(11,22,48,.35);backdrop-filter:blur(6px);display:grid;place-items:center;animation:fade .25s}
.sheet{width:480px;background:#fff;border-radius:32px;padding:32px;box-shadow:0 30px 80px rgba(11,22,48,.35);animation:rise .4s var(--e)}
.sheet h2{font-size:30px;font-weight:900;letter-spacing:-.03em}.sheet .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
.gopt{height:110px;border-radius:24px;border:2px solid var(--bd);font-size:56px;font-weight:900;background:#fff}.gopt:hover{border-color:var(--b2);background:#f4f8ff}.gopt.on{border-color:var(--b1);background:#eaf0ff;color:var(--b1)}
.gopt:active{transform:scale(.96)}

/* ===== PWA / TABLET ===== */
html.bluebg,html.bluebg body{background:linear-gradient(#0a4a9a,#031a45)}
html,body{background:#fff;position:fixed;inset:0;width:100%;height:100dvh;-webkit-touch-callout:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{box-shadow:0 30px 80px rgba(11,40,120,.3);will-change:transform}
#rot{display:none;position:fixed;inset:0;z-index:999;background:#fff;flex-direction:column;align-items:center;justify-content:center;gap:22px;font:900 34px Inter,sans-serif;letter-spacing:-.02em;color:#0b1630}
@media (orientation:portrait) and (max-aspect-ratio:9/10){#rot{display:flex}}
.rotic{animation:rotp 2.6s ease-in-out infinite}@keyframes rotp{0%,25%{transform:rotate(0)}65%,100%{transform:rotate(-90deg)}}
@media (display-mode:fullscreen),(display-mode:standalone){#stage{border-radius:26px}}

#nm{color:#fff;text-shadow:0 6px 30px rgba(0,30,90,.6)}
/* ===== TOASTS + MODALS ===== */
.toast{background:#fff;color:var(--ink);border:1px solid var(--bd);border-radius:12px;padding:12px 18px 12px 12px;font-size:15px;font-weight:800;box-shadow:0 14px 34px -10px rgba(11,22,48,.3)}.toast.er{background:#fff;border-color:#fecaca}
.toast i{width:22px;height:22px;border-radius:50%;background:#16a34a;color:#fff;display:grid;place-items:center;flex:none;font-style:normal;font-size:13px}.toast.er i{background:#dc2626}
.mdl{width:440px;max-width:calc(100% - 32px);padding:26px;border-radius:18px}.mdl h2{font-size:24px}.mdl p{color:var(--mut);font-weight:600;font-size:16px;line-height:1.5;margin:8px 0 22px}
.mf{display:flex;justify-content:flex-end;gap:10px}.mdl .xpr,.mdl .xbn{height:46px;padding:0 20px}.xpr.xpr--danger{background:#dc2626}.xpr.xpr--danger:hover{background:#b91c1c}
.ovl .pill{border-radius:10px;background:var(--b1);box-shadow:0 1px 2px rgba(0,0,0,.08)}.ovl .pill:before,.ovl .pill:after{display:none}.ovl .pill.w{background:#fff;color:var(--ink);border:1px solid #e4e4e7}
/* ===== BRIEFING + NAME PANEL ===== */
.bf{width:520px}.bh{display:flex;gap:14px;align-items:center;margin-bottom:16px}.bh h2{font-size:24px}.bh p{margin:0}
.bl{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}.bi{display:flex;gap:12px;padding:14px;border-radius:12px;background:#fffbeb;border:1px solid #fde68a}
.bi i{width:24px;height:24px;border-radius:50%;background:#16a34a;color:#fff;display:grid;place-items:center;font-style:normal;font-size:13px;flex:none;margin-top:1px}.bi b{font-weight:800;font-size:16px}.bi div div{color:var(--mut);font-weight:600;font-size:14px;margin-top:2px;line-height:1.45}
.nst{margin-top:26px;padding:16px 18px}.nst h3{font-size:15px;font-weight:900;letter-spacing:-.01em}
.ns3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.ns3 b{display:block;font-size:26px;font-weight:900;letter-spacing:-.03em;line-height:1.15}.ns3 span{font-size:12px;font-weight:700;color:var(--mut)}
.nst .last{border-top:1px solid var(--bd);padding-top:10px;font-size:13px;font-weight:700;color:var(--mut)}
/* ===== WEIGHT: BLUE PANEL ===== */
.wbg{position:absolute;left:0;top:0;bottom:0;width:calc((100% - 1100px)/2 + 640px);background:radial-gradient(circle at 20% 8%,rgba(255,255,255,.24),transparent 55%),linear-gradient(165deg,#3b82ff 0%,#2563ff 48%,#1448d8 100%);box-shadow:14px 0 44px -14px rgba(20,72,216,.4)}
#bw small{color:rgba(255,255,255,.85)}#bw{text-shadow:0 10px 40px rgba(8,36,140,.3)}
#cs{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.38)}#cs.ok{background:#fff;color:#1448d8;border-color:#fff}#cs.er{background:#fff;color:#d9473a;border-color:#fff}
.rng{background:rgba(255,255,255,.22)}.rng u{background:linear-gradient(90deg,#fff,#cfe0ff)}.rng i{background:#fff;box-shadow:0 2px 10px rgba(8,36,140,.35)}
/* ===== WEIGHT EXTRAS + KIOSK LOCK ===== */
@keyframes shk{0%,100%{transform:translateX(0)}15%{transform:translateX(-24px)}30%{transform:translateX(22px)}45%{transform:translateX(-16px)}60%{transform:translateX(12px)}75%{transform:translateX(-6px)}90%{transform:translateX(3px)}}
#bw.shake{animation:shk .5s}
#bw.red{text-shadow:0 8px 34px rgba(0,16,90,.55)}.wbg.alert{background:linear-gradient(165deg,#ff6a5c,#d92d20 90%)}
.wt{font-size:40px;font-weight:900;letter-spacing:-.03em;color:#fff;line-height:1.1}.ws{font-size:17px;font-weight:600;color:rgba(255,255,255,.8);margin-top:6px}
.wcs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gl{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:12px 16px;color:#fff;backdrop-filter:blur(8px)}.gl span{display:block;font-size:13px;font-weight:700;opacity:.8}.gl b{font-size:22px;font-weight:900;letter-spacing:-.02em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}input,textarea{-webkit-user-select:text;user-select:text}
/* ===== CAPTURE SCREEN ===== */
.cvf{flex:1;min-width:0;border-radius:18px;padding:14px;background:radial-gradient(circle at 15% 0,rgba(255,255,255,.28),transparent 50%),linear-gradient(160deg,#3b82ff,#1a4fe0 60%,#0b2fa8);box-shadow:0 22px 46px -18px rgba(37,99,255,.55);display:flex}
.tray{flex:1;position:relative;border-radius:12px;background:linear-gradient(#fff,#f1f6ff);display:grid;place-items:center;overflow:hidden}
.gd2{position:absolute;inset:8%;border:1.5px dashed rgba(37,99,255,.4);border-radius:10px}
.cb{position:absolute;width:44px;height:44px;border:5px solid var(--b1);filter:drop-shadow(0 0 6px rgba(37,99,255,.45));animation:brp 1.8s ease-in-out infinite alternate}
.cb.tl{left:7%;top:7%;border-right:0;border-bottom:0;border-radius:14px 0 0 0}.cb.tr{right:7%;top:7%;border-left:0;border-bottom:0;border-radius:0 14px 0 0}.cb.bl{left:7%;bottom:7%;border-right:0;border-top:0;border-radius:0 0 0 14px}.cb.br2{right:7%;bottom:7%;border-left:0;border-top:0;border-radius:0 0 14px 0}
.scan2{position:absolute;left:5%;right:5%;height:3px;border-radius:3px;background:var(--b1);box-shadow:0 0 20px 6px rgba(37,99,255,.4);animation:scan2 2.8s ease-in-out infinite alternate}@keyframes scan2{from{top:9%}to{top:91%}}
.cside{width:360px;flex:none;padding:24px;display:flex;flex-direction:column}
.cth{display:flex;gap:14px;align-items:center;padding:12px;border-radius:14px;background:#f3f7ff;border:1px solid var(--bd)}
.tips{display:flex;flex-direction:column;gap:12px;margin-top:20px}.tips>div{display:flex;gap:12px;align-items:flex-start;font-size:16px;font-weight:600;color:var(--mut);line-height:1.4}.tips i{width:26px;height:26px;border-radius:50%;background:#eaf0ff;color:var(--b1);font-style:normal;font-weight:900;font-size:13px;display:grid;place-items:center;flex:none}
.cst{margin-top:auto;display:flex;align-items:center;font-size:13px;font-weight:700;color:var(--mut);border-top:1px solid var(--bd);padding-top:14px}
.xpr.busy{opacity:.85;pointer-events:none}
.xres{justify-content:center;gap:18px}.xrows{margin-top:0}
/* ===== ADMIN ACCESS (who's grading) ===== */
.adm{position:absolute;right:18px;bottom:33px;height:44px;padding:0 16px 0 13px;border-radius:14px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--mut);background:#fff;border:1px solid var(--bd);box-shadow:0 2px 0 var(--bd)}
.adm:hover{color:var(--ink);border-color:#c4d4fb;transform:translateY(-1px)}.adm:active{transform:scale(.96)}
/* ===== FIRST-TIME TUTORIAL ===== */
.tut{position:absolute;inset:0;z-index:55;overflow:hidden;background:radial-gradient(circle at 100% 0,rgba(59,139,255,.16),transparent 45%),linear-gradient(#fff,#f3f7ff);animation:tin2 .55s var(--e)}
@keyframes tin2{from{opacity:0;transform:scale(1.025)}}
.tut.out{animation:tout .28s ease-in forwards;pointer-events:none}@keyframes tout{to{opacity:0;transform:scale(.985)}}
.tp-bg i{position:absolute;border-radius:50%;pointer-events:none}
.tp-bg i:nth-child(1){width:560px;height:560px;right:-160px;top:-200px;background:radial-gradient(circle,rgba(120,170,255,.4),transparent 68%);animation:drift2 12s ease-in-out infinite alternate}
.tp-bg i:nth-child(2){width:520px;height:520px;left:-180px;bottom:-220px;background:radial-gradient(circle,rgba(94,227,192,.34),transparent 68%);animation:drift2 15s ease-in-out infinite alternate-reverse}
@keyframes drift2{to{transform:translate(-60px,50px) scale(1.15)}}
.tp-skip{position:absolute;right:46px;top:8px;z-index:3}
.tp-art{position:absolute;left:46px;top:62px;width:520px;height:578px;border-radius:38px;overflow:hidden;background:radial-gradient(circle at 18% 0,rgba(255,255,255,.34),transparent 52%),linear-gradient(160deg,#3b82ff,#1a4fe0 58%,#0b2fa8);box-shadow:0 40px 70px -26px rgba(26,79,224,.65);animation:rise .7s .1s var(--e) backwards}
.tp-dots{position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.22) 1.6px,transparent 1.9px) 0 0/28px 28px;-webkit-mask:radial-gradient(circle at 50% 55%,#000 15%,transparent 75%);mask:radial-gradient(circle at 50% 55%,#000 15%,transparent 75%);animation:dotmv 18s linear infinite}
@keyframes dotmv{to{background-position:28px 28px}}
.tp-halo{position:absolute;left:50%;top:54%;width:470px;height:470px;margin:-235px 0 0 -235px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.42),rgba(255,255,255,.12) 46%,transparent 70%);animation:halo 4.5s ease-in-out infinite alternate}
@keyframes halo{to{transform:scale(1.12);opacity:.7}}
.tp-bub{position:absolute;bottom:-24px;border-radius:50%;background:rgba(255,255,255,.24);animation:bub linear infinite}

.docp-tl strong{display:block;font-size:15px;color:#fff;margin-top:4px}
.docp-tl p{margin:4px 0 0;font-size:12.5px;color:rgba(255,255,255,.68)}
.docp-stage{position:relative;overflow:hidden;border-radius:30px;padding:38px 34px;color:#fff;background:radial-gradient(640px 360px at 80% 20%,rgba(59,139,255,.32),transparent 65%),linear-gradient(155deg,#071636,#040e24);border:1px solid rgba(125,183,251,.22);box-shadow:0 28px 70px -24px rgba(4,15,41,.65)}
.docp-fan{display:flex;justify-content:center;align-items:center;gap:0;margin:28px 0 18px;padding:12px 0;min-height:240px}
.docp-fan img{width:240px;aspect-ratio:16/10;object-fit:cover;border-radius:16px;border:2px solid rgba(255,255,255,.26);box-shadow:0 22px 44px -14px rgba(0,0,0,.65);transition:transform .3s ease,z-index .1s;cursor:zoom-in;margin-left:-44px;background:#091a42}
.docp-fan img:first-child{margin-left:0;transform:rotate(-7deg) translateY(10px)}
.docp-fan img:nth-child(2){transform:rotate(-3.5deg) translateY(3px)}
.docp-fan img:nth-child(3){transform:translateY(-4px) scale(1.06);z-index:3;border-color:#7db7fb}
.docp-fan img:nth-child(4){transform:rotate(3.5deg) translateY(3px)}
.docp-fan img:nth-child(5){transform:rotate(7deg) translateY(10px)}
.docp-fan img:hover{transform:translateY(-12px) scale(1.1)!important;z-index:10;border-color:#fff}
.docp-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:16px}
.docp-shot{position:relative;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);cursor:zoom-in;transition:transform .2s ease,border-color .2s ease}
.docp-shot:hover{transform:translateY(-3px);border-color:#7db7fb}
.docp-shot img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.docp-shot span{display:block;padding:8px 10px;font-size:11.5px;font-weight:700;color:rgba(255,255,255,.86)}
.docp-bento{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:20px}
.docp-bcard{position:relative;border-radius:22px;overflow:hidden;background:#fff;border:1px solid #e3eaf8;box-shadow:0 12px 32px -18px rgba(18,59,112,.22);cursor:zoom-in;transition:transform .22s ease}
.docp-bcard:hover{transform:translateY(-4px)}
.docp-bcard.wide{grid-column:span 2}
.docp-bcard img{width:100%;height:100%;min-height:220px;max-height:310px;object-fit:cover;display:block}
.docp-bcap{position:absolute;left:14px;bottom:14px;padding:6px 12px;border-radius:999px;background:rgba(4,15,41,.78);color:#fff;font-size:12px;font-weight:700;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16)}
@media(max-width:900px){.docp-meta,.docp-tl{grid-template-columns:1fr 1fr}.docp-strip{grid-template-columns:repeat(2,minmax(0,1fr))}.docp-bento{grid-template-columns:1fr}.docp-bcard.wide{grid-column:span 1}.docp-fan{display:none}}

function tutorial(next,replay){
 document.querySelector('.tut')?.remove();
 const last=TUT.length-1,bub=[[8,10,9,0],[22,16,13,3],[41,8,10,6],[63,12,12,1.5],[78,18,15,4],[91,9,11,7]];
 let i=0,leaving=0,sx=null;

 o.innerHTML=`<div class="tp-bg"><i></i><i></i></div><div class="vc"><button class="bk tp-skip" id="tps">${replay?'Close':'Skip'} ${ic('skip',18)}</button>

 <div class="tp-col"><div class="tp-prog">${TUT.map((s,k)=>`<button class="tp-seg" data-k="${k}" aria-label="Go to step ${k+1}"><i></i></button>`).join('')}</div>
 <div class="tp-txts">${TUT.map((s,k)=>`<div class="tp-t"><div class="tp-eye"><b>0${k+1}</b><span>Guided tutorial</span></div><h2>${s.t}</h2><p>${s.d}</p></div>`).join('')}</div>
 <div class="tp-act"><button class="pill w tp-back" id="tpb" aria-label="Back">${ic('back',24)}</button><button class="pill" id="tpn"></button></div></div></div>`;
 st.appendChild(o);
 const $o=s=>o.querySelector(s),all=s=>[...o.querySelectorAll(s)];
 const set=n=>{i=Math.max(0,Math.min(last,n));
  ['.tp-fig','.tp-t','.tp-wm','.tp-seg'].forEach(q=>all(q).forEach((el,k)=>{el.classList.toggle('on',k===i);el.classList.toggle('pv',k<i);el.classList.toggle('d',k<i)}));
  $o('#tpa').className='tp-art s'+(i+1);
  const b=$o('#tpb');b.classList.toggle('hide',i===0);b.tabIndex=i===0?-1:0;
  const nb=$o('#tpn');nb.innerHTML=i<last?`Next ${ic('arrow')}`:replay?'Got it':`Start capture ${ic('cam',22)}`;nb.classList.remove('bump');void nb.offsetWidth;nb.classList.add('bump')};

 const kd=e=>{if(!o.isConnected){document.removeEventListener('keydown',kd,true);return}
  e.stopPropagation();
  if(e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();i<last?set(i+1):close()}
  else if(e.key==='ArrowLeft'){e.preventDefault();set(i-1)}
  else if(e.key==='Escape'){e.preventDefault();close()}};
 document.addEventListener('keydown',kd,true);
 $o('#tpn').onclick=()=>i<last?set(i+1):close();
 $o('#tpb').onclick=()=>set(i-1);
 $o('#tps').onclick=close;
 all('.tp-seg').forEach(b=>b.onclick=()=>set(+b.dataset.k));
 o.addEventListener('pointerdown',e=>{sx=e.clientX});
 o.addEventListener('pointerup',e=>{if(sx==null)return;const d=e.clientX-sx;sx=null;if(Math.abs(d)>70)set(i+(d<0?1:-1))});
 set(0);$o('#tpn').focus({preventScroll:true})}

addEventListener('keydown',e=>{if(document.querySelector('.ovl')){if(e.key==='Escape'&&!document.querySelector('.ovl.must'))document.querySelector('.ovl').remove();return}
